services:
  da13_head:
    build:
      context: ..
      dockerfile: Dockerfile.da13
    image: daxda/da13-validator:2.0.0
    container_name: da13-validator-head
    ports:
      - "8000:8000"
      - "9090:9090"
      - "8765:8765"
    environment:
      PYTHONUNBUFFERED: "1"
      DA13_INITIAL_WORKERS: "4"
      DA13_MIN_WORKERS: "1"
      DA13_MAX_WORKERS: "1024"
      DA13_API_PORT: "8000"
      DA13_METRICS_PORT: "9090"
      DA13_API_KEYS: "da13-public-renter:validator,da13-admin-renter:admin"
      DA13_PUBLIC_API_KEY: "da13-public-renter"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ../outputs:/app/outputs
    runtime: nvidia
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
              count: all
    restart: unless-stopped
    command: ["python", "tools/serve_da13_gpu.py"]
