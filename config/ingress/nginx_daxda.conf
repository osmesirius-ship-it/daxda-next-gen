# Nginx Production Reverse Proxy Configuration for DAXDA.IA
# =========================================================
# High-Throughput Wire-Speed Ingress (Up to 100,000 req/sec)

upstream daxda_daemon_backend {
    server 127.0.0.1:8088;
    keepalive 512;
}

# Rate limiting zones per tenant / client IP
limit_req_zone $binary_remote_addr zone=api_general_limit:20m rate=1000r/s;
limit_req_zone $http_authorization zone=api_tenant_limit:20m rate=2000r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.daxda.ia dashboard.daxda.ia billing.daxda.ia;

    # Automatic HTTPS redirection
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.daxda.ia;

    # SSL TLS 1.3 Configuration
    ssl_certificate /etc/letsencrypt/live/api.daxda.ia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.daxda.ia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Enterprise Hardened Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-DAXDA-Protocol "Nicole-Protocol-886-Ops" always;

    # Maximum client payload size (fail-closed against buffer overflow)
    client_max_body_size 2M;

    # Commercial Governed Ingress API Endpoint
    location /api/v1/govern {
        limit_req zone=api_tenant_limit burst=500 nodelay;
        proxy_pass http://daxda_daemon_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Metered Billing & Account Management Endpoints
    location /api/v1/billing {
        proxy_pass http://daxda_daemon_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Real-time Telemetry and DePIN endpoints
    location /api/ {
        limit_req zone=api_general_limit burst=200 nodelay;
        proxy_pass http://daxda_daemon_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Catch-all
    location / {
        proxy_pass http://daxda_daemon_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
