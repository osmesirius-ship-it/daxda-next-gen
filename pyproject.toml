[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daxda-next-gen"
version = "12.0.0-prod"
description = "DAXDA Next-Gen Neural-Symbolic Governance & AGI Containment Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.0.0",
    "ray>=2.0.0",
    "pydantic>=2.0.0",
    "TTS>=0.22.0",
    "feedgen>=1.0.0"
]
