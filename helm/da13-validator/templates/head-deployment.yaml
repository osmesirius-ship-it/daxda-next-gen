apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-head
  labels:
    app.kubernetes.io/name: da13-validator
    app.kubernetes.io/component: head
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount.head }}
  selector:
    matchLabels:
      app.kubernetes.io/name: da13-validator
      app.kubernetes.io/component: head
  template:
    metadata:
      labels:
        app.kubernetes.io/name: da13-validator
        app.kubernetes.io/component: head
    spec:
      containers:
        - name: head-node
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          ports:
            - containerPort: 8000
              name: http-api
            - containerPort: 9090
              name: metrics
            - containerPort: 8765
              name: websocket
          resources:
            {{- toYaml .Values.resources.head | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
