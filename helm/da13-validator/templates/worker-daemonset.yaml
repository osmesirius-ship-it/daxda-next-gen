apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: da13-validator
    app.kubernetes.io/component: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount.minWorkers }}
  selector:
    matchLabels:
      app.kubernetes.io/name: da13-validator
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: da13-validator
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: gpu-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          command: ["python", "-m", "da13_validator.workers.gpu_worker"]
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
